id: python-parse-access-logs
title: Count HTTP status codes per path from raw log lines
round: python
topic: [parsing, data-quality]
levels: [junior, mid]
difficulty: easy
companies: []
time_minutes: 20
prompt: |
  You get an iterable of raw log lines like:

  ```
  2024-05-01T10:00:00Z GET /api/orders 200 123ms
  2024-05-01T10:00:01Z POST /api/orders 500 87ms
  ```

  Write `status_counts(lines)` that returns a tuple `(counts, bad_lines)`:

  - `counts`: `dict[path, dict[status_code_int, count]]`
  - `bad_lines`: the number of lines that don't match the format (wrong number of fields, non-integer status, status outside 100–599, latency not ending in `ms`)

  Blank lines are ignored and are not counted as bad. Don't stop on a bad line.
hints:
  - Split on whitespace and validate each field; never let one bad line raise.
  - '`collections.defaultdict` keeps the nested counting short.'
solution:
  python: |
    from collections import defaultdict

    def status_counts(lines):
        counts = defaultdict(lambda: defaultdict(int))
        bad = 0
        for raw in lines:
            line = raw.strip()
            if not line:
                continue
            parts = line.split()
            if len(parts) != 5:
                bad += 1
                continue
            _ts, _method, path, status, latency = parts
            if not status.isdigit() or not 100 <= int(status) <= 599 or not latency.endswith("ms"):
                bad += 1
                continue
            counts[path][int(status)] += 1
        return {p: dict(s) for p, s in counts.items()}, bad
  explanation: |
    The interview signal here is **defensive parsing**: real logs contain truncated lines, garbage and new formats. Validate each field, count what you skip (so data loss is visible, not silent), and keep going.

    Return plain dicts, not defaultdicts, so callers don't get surprise keys on lookup. For huge files, the same function works on a file object because it only iterates once.
tests: |
  lines = [
      "2024-05-01T10:00:00Z GET /api/orders 200 123ms",
      "2024-05-01T10:00:01Z POST /api/orders 500 87ms",
      "2024-05-01T10:00:02Z GET /api/orders 200 10ms",
      "2024-05-01T10:00:03Z GET /health 200 1ms",
      "",
      "garbage",
      "2024-05-01T10:00:04Z GET /api/orders abc 5ms",
      "2024-05-01T10:00:05Z GET /api/orders 700 5ms",
      "2024-05-01T10:00:06Z GET /api/orders 200 5s",
  ]
  counts, bad = status_counts(lines)
  assert counts == {"/api/orders": {200: 2, 500: 1}, "/health": {200: 1}}
  assert bad == 4
  assert status_counts([]) == ({}, 0)
  assert status_counts(iter(["  ", "\n"])) == ({}, 0)  # works on any iterable, blanks ignored
rubric:
  - point: 'Never crashes on a malformed line; counts and reports skipped lines'
    weight: 3
    topic: data-quality
  - point: 'Validates each field (count, numeric status, range, latency unit)'
    weight: 2
    topic: parsing
  - point: 'Streams the input once (works on a file object, not only a list)'
    weight: 1
    topic: parsing
follow_ups:
  - q: 'The file is 200 GB. What changes, if anything?'
    a: 'Streaming line by line still works for memory, but one process is slow. Split the file into byte ranges aligned to line breaks, process them in parallel, and merge the counters, or use Spark or a warehouse to do the same.'
  - q: 'How would you report the bad lines so someone can fix the producer?'
    a: 'Count them by reason, keep a sample of bad lines with the file name and line number, write them to a quarantine file or table, and alert if the bad-line rate crosses a threshold.'
