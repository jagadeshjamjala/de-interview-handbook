name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Datasets are reproducible
        run: |
          python datasets/generate.py
          git diff --exit-code -- datasets/checksums.sha256 apps/website/static/datasets
      - name: SQL solutions match golden results
        run: python scripts/verify_sql.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm questions # validates every question YAML; fails on error
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
